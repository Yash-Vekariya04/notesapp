<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151513" />
    <title>Notes | Local workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111110;
        --bar: #151513;
        --surface: #1c1c1a;
        --hover: #292926;
        --line: #30302c;
        --text: #f6f4ed;
        --dim: #a7a59d;
        --accent: #f9d674;
        --accent-ink: #292314;

        --c-yellow-bg: #f9e29b;
        --c-yellow-tx: #302609;
        --c-blue-bg: #c6dcfa;
        --c-blue-tx: #192d46;
        --c-green-bg: #c3eacb;
        --c-green-tx: #193724;
        --c-pink-bg: #f8cfe4;
        --c-pink-tx: #4a1734;
        --c-orange-bg: #fbd7b3;
        --c-orange-tx: #47250d;
        --c-purple-bg: #e8d6fa;
        --c-purple-tx: #38214d;
        --c-gray-bg: #e4e5e8;
        --c-gray-tx: #29303b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font:
          400 1rem/1.5 Roboto,
          system-ui,
          sans-serif;
      }

      .shell {
        width: min(100%, 1080px);
        margin-inline: auto;
        padding-inline: clamp(16px, 4vw, 40px);
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--bar);
        padding-block: 16px;
      }

      .header-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      #searchInput {
        width: min(100%, 320px);
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      main {
        padding-block: 32px 48px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.75rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 8px 0 24px;
        color: var(--dim);
      }

      #noteForm {
        display: grid;
        gap: 12px;
        padding: 20px;
        margin-bottom: 28px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }

      #noteForm input[type="text"],
      #noteForm textarea,
      #noteForm select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }

      #noteForm textarea {
        min-height: 90px;
        resize: vertical;
      }

      .form-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .form-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
      }

      .form-controls select {
        width: auto;
      }

      .pin-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--dim);
        cursor: pointer;
      }

      button[type="submit"] {
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 700 0.92rem/1 inherit;
        cursor: pointer;
      }

      button[type="submit"]:hover {
        background: #ffe299;
      }

      #notesList {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px;
      }

      .note-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px;
        border-radius: 14px;
        background: var(--paper, var(--c-gray-bg));
        color: var(--ink, var(--c-gray-tx));
        overflow-wrap: anywhere;
      }

      .note-card.yellow {
        --paper: var(--c-yellow-bg);
        --ink: var(--c-yellow-tx);
      }
      .note-card.blue {
        --paper: var(--c-blue-bg);
        --ink: var(--c-blue-tx);
      }
      .note-card.pink {
        --paper: var(--c-pink-bg);
        --ink: var(--c-pink-tx);
      }
      .note-card.green {
        --paper: var(--c-green-bg);
        --ink: var(--c-green-tx);
      }
      .note-card.orange {
        --paper: var(--c-orange-bg);
        --ink: var(--c-orange-tx);
      }
      .note-card.purple {
        --paper: var(--c-purple-bg);
        --ink: var(--c-purple-tx);
      }
      .note-card.gray {
        --paper: var(--c-gray-bg);
        --ink: var(--c-gray-tx);
      }

      .note-card h3 {
        margin: 0;
        font-size: 1.1rem;
      }

      .note-card p {
        margin: 0;
        white-space: pre-wrap;
        flex: 1;
      }

      .note-actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }

      .note-actions button {
        padding: 6px 12px;
        border: 1px solid rgb(0 0 0 / 0.2);
        border-radius: 8px;
        background: rgb(255 255 255 / 0.45);
        color: inherit;
        font: 600 0.82rem/1 inherit;
        cursor: pointer;
      }

      .note-actions button:hover {
        background: rgb(255 255 255 / 0.75);
      }

      .empty-msg {
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell header-inner">
        <div class="brand">Notes Workspace</div>
        <input
          id="searchInput"
          type="search"
          placeholder="Search notes..."
          aria-label="Search notes"
        />
      </div>
    </header>

    <main class="shell">
      <h1>Your notes</h1>
      <p class="subtitle">Simple local notes saved in your browser.</p>

      <form id="noteForm">
        <input id="titleInput" type="text" placeholder="Note title" />
        <textarea id="bodyInput" placeholder="Write your note..."></textarea>
        <div class="form-row">
          <div class="form-controls">
            <select id="colorSelect" aria-label="Note color">
              <option value="yellow">Yellow</option>
              <option value="blue">Blue</option>
              <option value="pink">Pink</option>
              <option value="green">Green</option>
              <option value="orange">Orange</option>
              <option value="purple">Purple</option>
              <option value="gray">Gray</option>
            </select>
            <label class="pin-label">
              <input id="pinnedInput" type="checkbox" />
              Pin note
            </label>
          </div>
          <button type="submit" id="submitBtn">Save Note</button>
        </div>
      </form>

      <div id="notesList"></div>
    </main>

    <script>
      const STORAGE_KEY = "simple_notes";

      const noteForm = document.getElementById("noteForm");
      const titleInput = document.getElementById("titleInput");
      const bodyInput = document.getElementById("bodyInput");
      const colorSelect = document.getElementById("colorSelect");
      const pinnedInput = document.getElementById("pinnedInput");
      const searchInput = document.getElementById("searchInput");
      const notesList = document.getElementById("notesList");
      const submitBtn = document.getElementById("submitBtn");

      let notes = loadNotes();
      let editingId = null;

      function loadNotes() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY); // load the notes from localStorage
          const parsed = saved ? JSON.parse(saved) : []; // parse the JSON string into an array (saved) as a string in localstorage
          return Array.isArray(parsed) ? parsed : []; // check if the parsed value is an array, if not return an empty array
        } catch {
          return [];
        }
      }

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function addOrUpdateNote(title, body, color, pinned) {
        const cleanTitle = title.trim();
        const cleanBody = body.trim();
        if (!cleanTitle && !cleanBody) return;

        if (editingId) {
          const note = notes.find((item) => item.id === editingId);
          if (note) {
            note.title = cleanTitle;
            note.body = cleanBody;
            note.color = color;
            note.pinned = pinned;
          }
          editingId = null;
          submitBtn.textContent = "Save Note";
        } else {
          notes.unshift({
            id: String(Date.now()),
            title: cleanTitle,
            body: cleanBody,
            color,
            pinned,
          });
        }

        saveNotes();
        renderNotes();
      }

      function deleteNote(id) {
        notes = notes.filter((item) => item.id !== id);
        if (editingId === id) {
          editingId = null;
          submitBtn.textContent = "Save Note";
          noteForm.reset();
        }
        saveNotes();
        renderNotes();
      }

      function startEdit(id) {
        const note = notes.find((item) => item.id === id);
        if (!note) return;

        editingId = note.id;
        titleInput.value = note.title;
        bodyInput.value = note.body;
        colorSelect.value = note.color;
        pinnedInput.checked = note.pinned;
        submitBtn.textContent = "Update Note";
        titleInput.focus();
      }

      function renderNotes() {
        const query = searchInput.value.trim().toLowerCase();
        notesList.textContent = "";

        const filtered = notes
          .filter(
            (note) =>
              note.title.toLowerCase().includes(query) ||
              note.body.toLowerCase().includes(query),
          )
          .sort((a, b) => Number(b.pinned) - Number(a.pinned));

        if (filtered.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-msg";
          empty.textContent = query
            ? "No notes match your search."
            : "No notes yet. Add one above.";
          notesList.appendChild(empty);
          return;
        }

        for (const note of filtered) {
          const card = document.createElement("article");
          card.className = `note-card ${note.color}`;

          const heading = document.createElement("h3");
          heading.textContent = `${note.pinned ? "📌 " : ""}${note.title || "Untitled"}`;

          const body = document.createElement("p");
          body.textContent = note.body;

          const actions = document.createElement("div");
          actions.className = "note-actions";

          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.textContent = "Edit";
          editBtn.addEventListener("click", () => startEdit(note.id));

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", () => deleteNote(note.id));

          actions.append(editBtn, deleteBtn);
          card.append(heading, body, actions);
          notesList.appendChild(card);
        }
      }

      noteForm.addEventListener("submit", (e) => {
        e.preventDefault();
        addOrUpdateNote(
          titleInput.value,
          bodyInput.value,
          colorSelect.value,
          pinnedInput.checked,
        );
        noteForm.reset();
      });

      searchInput.addEventListener("input", renderNotes);

      renderNotes();
    </script>
  </body>
</html>
